name: Telegram GitHub Notifications

on:
    push:
        branches:
            - "**"
    release:
        types: [published]

permissions:
    contents: read

jobs:
    notify:
        runs-on: ubuntu-latest

        steps:
            - name: Send Telegram notification
              shell: bash
              env:
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
                  EVENT_NAME: ${{ github.event_name }}
                  REPOSITORY: ${{ github.repository }}
                  ACTOR: ${{ github.actor }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  EVENT_PATH="$GITHUB_EVENT_PATH"

                    if [[ -z "$EVENT_PATH" || ! -f "$EVENT_PATH" ]]; then
                    echo "GitHub event JSON file not found: $EVENT_PATH"
                    exit 1
                    fi
                    
                  set -euo pipefail

                  if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
                    echo "Missing Telegram secrets."
                    exit 1
                  fi

                  if [[ "$EVENT_NAME" == "push" ]]; then
                    COMMIT_COUNT=$(jq '.commits | length' "$EVENT_PATH")

                    COMMIT_LIST=$(jq -r '
                      .commits[:10][]?
                      | "- " + (.message | split("\n")[0]) + " (" + .id[0:7] + ")"
                    ' "$EVENT_PATH")

                    if [[ -z "$COMMIT_LIST" ]]; then
                      COMMIT_LIST="（没有可显示的提交摘要）"
                    fi

                    if (( COMMIT_COUNT > 10 )); then
                      COMMIT_LIST+=$'\n'"……另有 $((COMMIT_COUNT - 10)) 条提交未显示"
                    fi

                    COMPARE_URL=$(jq -r '.compare // empty' "$EVENT_PATH")

                    MESSAGE=$(printf \
                      '📦 GitHub Push 通知\n\n仓库：%s\n分支：%s\n推送者：%s\n提交数量：%s\n\n提交摘要：\n%s\n\n比较链接：\n%s' \
                      "$REPOSITORY" "$REF_NAME" "$ACTOR" \
                      "$COMMIT_COUNT" "$COMMIT_LIST" "$COMPARE_URL")

                  elif [[ "$EVENT_NAME" == "release" ]]; then
                    RELEASE_NAME=$(jq -r '.release.name // .release.tag_name' "$EVENT_PATH")
                    RELEASE_TAG=$(jq -r '.release.tag_name' "$EVENT_PATH")
                    RELEASE_URL=$(jq -r '.release.html_url' "$EVENT_PATH")
                    RELEASE_BODY=$(jq -r '.release.body // "（没有发布说明）"' "$EVENT_PATH")
                    RELEASE_BODY=$(printf '%s' "$RELEASE_BODY" | cut -c 1-2000)

                    MESSAGE=$(printf \
                      '🚀 GitHub Release 发布\n\n仓库：%s\n版本：%s\n标签：%s\n发布者：%s\n\n发布说明：\n%s\n\n查看 Release：\n%s' \
                      "$REPOSITORY" "$RELEASE_NAME" "$RELEASE_TAG" \
                      "$ACTOR" "$RELEASE_BODY" "$RELEASE_URL")
                  else
                    echo "Unsupported event: $EVENT_NAME"
                    exit 1
                  fi

                  PAYLOAD=$(jq -n \
                    --arg chat_id "$TELEGRAM_CHAT_ID" \
                    --arg text "$MESSAGE" \
                    '{
                      chat_id: $chat_id,
                      text: $text,
                      disable_web_page_preview: true
                    }')

                  RESPONSE=$(curl --fail-with-body --silent --show-error \
                    --request POST \
                    --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    --header "Content-Type: application/json" \
                    --data "$PAYLOAD")

                  echo "$RESPONSE" | jq -e '.ok == true' > /dev/null
                  echo "Telegram notification sent successfully."
